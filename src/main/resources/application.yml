spring:
  application:
    name: QuizApp
    profiles:
      active: true
  datasource:
    url: jdbc:postgresql://localhost:5432/dev_db
    username: postgres
    password: patil@123


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-cu8lm6350x8ip525.us.auth0.com/
          audience: https://quizapi

